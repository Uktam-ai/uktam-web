# GitHub's dependency graph does not read bun.lock, so repository security
# alerts never see our npm packages. Dependabot's own bun ecosystem does, so
# this is what actually catches a vulnerable release (the TanStack Start XSS
# that Vercel blocked in Nov 2026 never raised an alert here).
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR a week for routine bumps instead of one per package.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
