                - paragraph [ref=f21e240]: "Four decisions shape the whole app: run locally, use Indic-native models, quantize hard, and never wait on a network."
            - article [ref=f21e242]:
                - text: Privacy
                - heading "100% offline & private" [level=3] [ref=f21e243]
                - paragraph [ref=f21e244]: No audio and no transcript ever leaves your device. Speech recognition, translation and speech synthesis all run locally on your phone's silicon.
            - generic [ref=f21e245]:
                - article [ref=f21e247]:
                    - text: Indic-first
                    - heading "Made for India, by Indian AI" [level=3] [ref=f21e248]
                    - paragraph [ref=f21e249]: Built strictly on models researched and trained for Indian languages — AI4Bharat and Sarvam AI — so dialects, nuance and grammar land properly.
                - article [ref=f21e251]:
                    - text: Optimised
                    - heading "Custom quantized for mobile" [level=3] [ref=f21e252]
                    - paragraph [ref=f21e253]: Multi-billion parameter models custom-quantized to GGUF and ONNX for this project, cutting memory and battery cost while holding near-parity accuracy.
                - article [ref=f21e255]:
                    - text: Independence
                    - heading "No round trip, ever" [level=3] [ref=f21e256]
                    - paragraph [ref=f21e257]: Speech lands as text in about 200 ms on device. Nothing queues behind an API and nothing degrades when the signal does — dead zones, remote areas and aeroplanes all behave identically.
