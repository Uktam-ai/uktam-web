                - paragraph [ref=f26e241]: "Four decisions shape the whole app: run locally, use Indic-native models, quantize hard, and never wait on a network."
            - article [ref=f26e243]:
                - text: Privacy
                - heading "100% offline & private" [level=3] [ref=f26e244]
                - paragraph [ref=f26e245]: No audio and no transcript ever leaves your device. Speech recognition, translation and speech synthesis all run locally on your phone's silicon.
            - generic [ref=f26e246]:
                - article [ref=f26e248]:
                    - text: Indic-first
                    - heading "Made for India, by Indian AI" [level=3] [ref=f26e249]
                    - paragraph [ref=f26e250]: Built strictly on models researched and trained for Indian languages — AI4Bharat and Sarvam AI — so dialects, nuance and grammar land properly.
                - article [ref=f26e252]:
                    - text: Optimised
                    - heading "Custom quantized for mobile" [level=3] [ref=f26e253]
                    - paragraph [ref=f26e254]: Multi-billion parameter models custom-quantized to GGUF and ONNX for this project, cutting memory and battery cost while holding near-parity accuracy.
                - article [ref=f26e256]:
                    - text: Independence
                    - heading "No round trip, ever" [level=3] [ref=f26e257]
                    - paragraph [ref=f26e258]: Speech lands as text in about 200 ms on device. Nothing queues behind an API and nothing degrades when the signal does — dead zones, remote areas and aeroplanes all behave identically.
