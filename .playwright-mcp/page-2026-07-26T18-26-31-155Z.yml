                - paragraph [ref=f28e241]: "Four decisions shape the whole app: run locally, use Indic-native models, quantize hard, and never wait on a network."
            - article [ref=f28e243]:
                - text: Privacy
                - heading "100% offline & private" [level=3] [ref=f28e244]
                - paragraph [ref=f28e245]: No audio and no transcript ever leaves your device. Speech recognition, translation and speech synthesis all run locally on your phone's silicon.
            - generic [ref=f28e246]:
                - article [ref=f28e248]:
                    - text: Indic-first
                    - heading "Made for India, by Indian AI" [level=3] [ref=f28e249]
                    - paragraph [ref=f28e250]: Built strictly on models researched and trained for Indian languages — AI4Bharat and Sarvam AI — so dialects, nuance and grammar land properly.
                - article [ref=f28e252]:
                    - text: Optimised
                    - heading "Custom quantized for mobile" [level=3] [ref=f28e253]
                    - paragraph [ref=f28e254]: Multi-billion parameter models custom-quantized to GGUF and ONNX for this project, cutting memory and battery cost while holding near-parity accuracy.
                - article [ref=f28e256]:
                    - text: Independence
                    - heading "No round trip, ever" [level=3] [ref=f28e257]
                    - paragraph [ref=f28e258]: Speech lands as text in about 200 ms on device. Nothing queues behind an API and nothing degrades when the signal does — dead zones, remote areas and aeroplanes all behave identically.
